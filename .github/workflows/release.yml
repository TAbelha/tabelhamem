name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Build and test
        run: |
          bun run build
          bun run test

      - name: Package plugin
        run: |
          mkdir -p dist
          cp packages/plugin/src/opencode.js "dist/tabelhamem-plugin-${{ github.ref_name }}.js"
          cp packages/plugin/install.sh dist/
          tar -C dist -czf "dist/tabelhamem-plugin-${{ github.ref_name }}.tar.gz" .

      # A tag with a SemVer pre-release suffix (v0.2.0-beta.1, v0.2.0-rc.1)
      # is published as a GitHub prerelease: excluded from "Latest release"
      # and clearly badged, so a beta doesn't shadow the last stable tag.
      - name: Detect prerelease tag
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: dist/*.tar.gz
